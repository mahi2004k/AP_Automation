server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing — any unknown path should fall
    # back to index.html instead of nginx returning a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reasonable caching for hashed build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
